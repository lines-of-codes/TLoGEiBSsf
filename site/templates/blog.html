{% extends "base.html" %} {% block title %} {{ section.title }} {% endblock
title %} {% block head %}
<style>
    .title {
        background-image: linear-gradient(
            to bottom right,
            var(--text-color),
            color-mix(var(--text-color), var(--background-color))
        );
    }
</style>
{% endblock head %} {% block content %}
<article>
    <h1 class="title">{{ section.title }}</h1>
    <ul class="post-list">
        {% for page in section.pages %}
        <li>
            <a href="{{ page.permalink | safe }}" class="post-entry">
                <strong>{{ page.title }}</strong><br />
                {{ page.description }}
            </a>
        </li>
        {% endfor %}
    </ul>
</article>
{% endblock content %}
